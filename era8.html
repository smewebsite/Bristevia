<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Era 8 | Imperial Sovereign of Bristevia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Cormorant Garamond", serif;

      background:
        radial-gradient(
          circle at center,
          rgba(12, 61, 115, 0.45),
          rgba(2, 12, 30, 0.98)
        ),
        #020b18;

      color: #f8f0d0;

      min-height: 100vh;

      overflow-x: hidden;

      line-height: 1.8;
    }

    /* =========================
       MAIN NAVIGATION
       ========================= */

    .main-navigation {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 5px;

      padding: 18px 15px;

      background:
        linear-gradient(
          rgba(2,18,42,0.96),
          rgba(2,11,27,0.99)
        );

      border-bottom: 1px solid rgba(212,175,55,0.45);

      box-shadow:
        0 5px 25px rgba(0,0,0,0.4);

      position: relative;

      z-index: 20;
    }

    .main-navigation a {
      font-family: "Cinzel", serif;

      font-size: 12px;

      letter-spacing: 1.5px;

      color: #f5e6a8;

      text-decoration: none;

      padding: 10px 15px;

      transition: 0.3s ease;
    }

    .main-navigation a:hover,
    .main-navigation a.active {
      color: #ffffff;

      text-shadow:
        0 0 10px rgba(212,175,55,0.8);
    }


    /* =========================
       ERA HERO
       ========================= */

    .era-hero {

      min-height: 72vh;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 100px 25px;

      position: relative;

      background:
        linear-gradient(
          rgba(1, 12, 30, 0.60),
          rgba(1, 12, 30, 0.88)
        ),
        url("era8-bg.jpg");

      background-size: cover;

      background-position: center;

      border-bottom: 1px solid rgba(212,175,55,0.55);
    }

    .era-hero::before {
      content: "";

      position: absolute;

      inset: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(212,175,55,0.18),
          transparent 62%
        );

      pointer-events: none;
    }

    .hero-content {
      position: relative;

      z-index: 2;

      max-width: 1100px;
    }

    .imperial-symbol {
      font-size: 70px;

      color: #d4af37;

      text-shadow:
        0 0 15px rgba(212,175,55,0.8),
        0 0 40px rgba(212,175,55,0.35);

      margin-bottom: 20px;
    }

    .era-label {
      font-family: "Cinzel", serif;

      color: #d4af37;

      font-size: 15px;

      letter-spacing: 6px;

      text-transform: uppercase;

      margin-bottom: 20px;
    }

    .era-hero h1 {
      font-family: "Cinzel", serif;

      font-size: clamp(38px, 6vw, 70px);

      line-height: 1.15;

      color: #f7e7a9;

      letter-spacing: 4px;

      text-shadow:
        0 3px 0 #8b6914,
        0 0 25px rgba(212,175,55,0.35);
    }

    .hero-subtitle {
      margin-top: 25px;

      font-family: "Cinzel", serif;

      font-size: clamp(17px, 2.5vw, 25px);

      letter-spacing: 3px;

      color: #ffffff;
    }

    .hero-period {
      margin-top: 15px;

      color: #d4af37;

      font-size: 20px;

      letter-spacing: 2px;
    }


    /* =========================
       ERA NAVIGATION
       ========================= */

    .era-navigation {

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      gap: 12px;

      padding: 22px 15px;

      background:
        rgba(1,10,25,0.97);

      border-bottom: 1px solid rgba(212,175,55,0.25);
    }

    .era-navigation a {

      font-family: "Cinzel", serif;

      color: #d4af37;

      text-decoration: none;

      font-size: 11px;

      letter-spacing: 1.5px;

      padding: 9px 14px;

      border: 1px solid rgba(212,175,55,0.3);

      transition: 0.3s ease;
    }

    .era-navigation a:hover {

      background: rgba(212,175,55,0.12);

      border-color: #d4af37;

      color: #ffffff;
    }

    .era-navigation .current {

      background: rgba(212,175,55,0.18);

      border-color: #d4af37;

      color: #ffffff;
    }


    /* =========================
       CONTENT
       ========================= */

    .era-content {

      max-width: 1100px;

      margin: auto;

      padding: 90px 25px;
    }

    .intro {

      text-align: center;

      max-width: 900px;

      margin: 0 auto 70px;
    }

    .intro h2 {

      font-family: "Cinzel", serif;

      color: #d4af37;

      font-size: clamp(26px, 4vw, 38px);

      letter-spacing: 3px;

      margin-bottom: 25px;
    }

    .intro p {

      color: #d8d8d8;

      font-size: 20px;

      line-height: 1.9;

      margin-bottom: 20px;
    }


    /* =========================
       SECTION
       ========================= */

    .history-section {

      margin-bottom: 75px;

      padding-bottom: 60px;

      border-bottom: 1px solid rgba(212,175,55,0.18);
    }

    .history-section:last-child {

      border-bottom: none;
    }

    .section-number {

      font-family: "Cinzel", serif;

      color: #d4af37;

      font-size: 14px;

      letter-spacing: 4px;

      margin-bottom: 10px;
    }

    .history-section h2 {

      font-family: "Cinzel", serif;

      color: #f7e7a9;

      font-size: clamp(25px, 4vw, 36px);

      line-height: 1.3;

      margin-bottom: 25px;
    }

    .history-section h3 {

      font-family: "Cinzel", serif;

      color: #d4af37;

      font-size: 22px;

      margin-top: 30px;

      margin-bottom: 12px;
    }

    .history-section p {

      color: #d5d8dd;

      font-size: 19px;

      margin-bottom: 20px;
    }


    /* =========================
       LISTS
       ========================= */

    .history-list {

      margin: 20px 0 25px 25px;

      color: #d5d8dd;

      font-size: 18px;
    }

    .history-list li {

      margin-bottom: 9px;

      padding-left: 5px;
    }

    .numbered-list {

      counter-reset: item;

      list-style: none;

      margin: 25px 0;
    }

    .numbered-list li {

      counter-increment: item;

      margin-bottom: 18px;

      padding: 18px 20px;

      background:
        linear-gradient(
          145deg,
          rgba(5,35,68,0.65),
          rgba(2,15,32,0.75)
        );

      border-left: 2px solid #d4af37;

      color: #d8d8d8;

      font-size: 18px;
    }

    .numbered-list li::before {

      content: counter(item) ".";

      font-family: "Cinzel", serif;

      color: #d4af37;

      margin-right: 10px;
    }


    /* =========================
       HISTORICAL IMAGE
       ========================= */

    .historical-image {

      margin: 40px 0;

      border: 1px solid rgba(212,175,55,0.45);

      background:
        rgba(2,15,32,0.9);

      box-shadow:
        0 15px 40px rgba(0,0,0,0.45);

      overflow: hidden;
    }

    .historical-image img {

      width: 100%;

      height: auto;

      min-height: 280px;

      max-height: 600px;

      object-fit: cover;

      display: block;
    }

    .image-caption {

      padding: 16px 20px;

      text-align: center;

      color: #c7c7c7;

      font-size: 16px;

      font-style: italic;

      border-top: 1px solid rgba(212,175,55,0.25);
    }


    /* =========================
       KEY EVENTS BOX
       ========================= */

    .event-box {

      margin: 30px 0;

      padding: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(8,42,78,0.75),
          rgba(2,15,32,0.9)
        );

      border:

        1px solid rgba(212,175,55,0.35);

      box-shadow:
        0 10px 30px rgba(0,0,0,0.3);
    }

    .event-box h3 {

      margin-top: 0;

      color: #d4af37;
    }

    .event-box p {

      margin-bottom: 10px;
    }


    /* =========================
       QUOTE / SIGNIFICANCE
       ========================= */

    .historical-quote {

      margin: 45px auto;

      max-width: 900px;

      text-align: center;

      padding: 40px 30px;

      border-top: 1px solid rgba(212,175,55,0.4);

      border-bottom: 1px solid rgba(212,175,55,0.4);

      color: #f7e7a9;

      font-family: "Cinzel", serif;

      font-size: clamp(20px, 3vw, 29px);

      line-height: 1.6;

      letter-spacing: 1px;
    }


    /* =========================
       END STATE
       ========================= */

    .end-state {

      padding: 55px 35px;

      margin-top: 30px;

      text-align: center;

      background:
        linear-gradient(
          145deg,
          rgba(7,38,73,0.8),
          rgba(1,12,27,0.95)
        );

      border: 1px solid rgba(212,175,55,0.4);

      box-shadow:
        0 15px 40px rgba(0,0,0,0.4);
    }

    .end-state h2 {

      font-family: "Cinzel", serif;

      color: #d4af37;

      font-size: 30px;
